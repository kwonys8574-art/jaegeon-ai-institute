<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 - 재건교회 AI 학술연구소</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">재건교회 AI 학술연구소 · 관리자</div>
    <nav>
      <a href="index.html">사이트로 돌아가기</a>
      <a href="#" id="logoutLink" style="display:none;">로그아웃</a>
    </nav>
  </header>

  <div id="loginView" class="login-box">
    <h2>관리자 로그인</h2>
    <input type="password" id="pwInput" placeholder="관리자 비밀번호" />
    <div class="error-msg" id="loginError"></div>
    <button id="loginBtn">로그인</button>
  </div>

  <div id="adminView" class="admin-wrap" style="display:none;">
    <div class="save-banner">
      <div>
        <div>
          변경 사항은 저장할 때마다 <strong>GitHub에 자동 반영</strong>됩니다.
          (마지막에 저장한 내용이 공개 사이트에 적용됩니다. 반영까지 1~2분 걸릴 수 있습니다.)
        </div>
        <div id="syncStatus" class="sync-status sync-ok">대기 중</div>
      </div>
      <button class="primary-btn" id="exportBtn">data.js 백업 다운로드</button>
    </div>

    <div class="form-box" id="tokenSetupBox">
      <h3 id="tokenSetupTitle">GitHub 자동 반영 토큰</h3>
      <p style="margin-top:0;color:#6b6b6b;font-size:0.9rem;">
        GitHub Actions를 실행할 토큰입니다. 이 브라우저에만 저장됩니다.
        토큰을 바꿔야 할 때는 아래에 새 토큰을 넣고 다시 저장하면 됩니다.
      </p>
      <div class="form-row">
        <label>GitHub Token (classic: public_repo / fine-grained: Contents Read and write)</label>
        <input type="password" id="dispatchTokenInput" placeholder="ghp_... 또는 github_pat_..." autocomplete="off" />
      </div>
      <button class="primary-btn" id="saveTokenBtn">토큰 저장</button>
      <button id="clearTokenBtn" style="margin-left:8px;">토큰 삭제</button>
      <div id="tokenStatusText" class="sync-status" style="margin-top:10px;"></div>
    </div>

    <div class="admin-toolbar">
      <h2 style="margin:0;">카테고리 관리</h2>
      <button class="primary-btn" id="newCategoryBtn">+ 새 카테고리 추가</button>
    </div>
    <div id="categoryListWrap" style="margin-bottom:36px;"></div>

    <div class="admin-toolbar">
      <h2 style="margin:0;">GPT 챗봇 관리</h2>
      <button class="primary-btn" id="newBtn">+ 새 챗봇 추가</button>
    </div>

    <div class="form-box" id="formBox" style="display:none;">
      <h3 id="formTitle">새 챗봇 추가</h3>
      <input type="hidden" id="editId" />
      <div class="form-row">
        <label>카테고리</label>
        <select id="fieldCategory"></select>
      </div>
      <div class="form-row">
        <label>제목</label>
        <input type="text" id="fieldTitle" placeholder="예: 원어 단어 분석 도우미" />
      </div>
      <div class="form-row">
        <label>설명</label>
        <textarea id="fieldDesc" placeholder="이 챗봇이 무엇을 도와주는지 간단히 설명해 주세요."></textarea>
      </div>
      <div class="form-row">
        <label>챗봇 링크 (ChatGPT GPTs 주소 등)</label>
        <input type="url" id="fieldLink" placeholder="https://chatgpt.com/g/..." />
      </div>
      <div class="form-row">
        <button class="primary-btn" id="saveEntryBtn">저장</button>
        <button id="cancelEntryBtn" style="margin-left:8px;">취소</button>
      </div>
    </div>

    <div id="listWrap"></div>
  </div>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
