<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 - 재건교회 AI 학술연구소</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">재건교회 AI 학술연구소 · 관리자</div>
    <nav>
      <a href="index.html">사이트로 돌아가기</a>
      <a href="#" id="logoutLink" style="display:none;">로그아웃</a>
    </nav>
  </header>

  <div id="loginView" class="login-box">
    <h2>관리자 로그인</h2>
    <input type="password" id="pwInput" placeholder="관리자 비밀번호" />
    <div class="error-msg" id="loginError"></div>
    <button id="loginBtn">로그인</button>
  </div>

  <div id="adminView" class="admin-wrap" style="display:none;">
    <div class="save-banner">
      <div>
        변경 사항은 이 브라우저에 자동 저장됩니다. <strong>다른 사람도 볼 수 있게 하려면</strong> 아래 버튼으로
        data.js 파일을 새로 받아서 기존 폴더의 data.js를 교체해 주세요.
      </div>
      <button class="primary-btn" id="exportBtn">data.js 파일로 저장</button>
    </div>

    <div class="admin-toolbar">
      <h2 style="margin:0;">GPT 챗봇 관리</h2>
      <button class="primary-btn" id="newBtn">+ 새 챗봇 추가</button>
    </div>

    <div class="form-box" id="formBox" style="display:none;">
      <h3 id="formTitle">새 챗봇 추가</h3>
      <input type="hidden" id="editId" />
      <div class="form-row">
        <label>카테고리</label>
        <select id="fieldCategory"></select>
      </div>
      <div class="form-row">
        <label>제목</label>
        <input type="text" id="fieldTitle" placeholder="예: 원어 단어 분석 도우미" />
      </div>
      <div class="form-row">
        <label>설명</label>
        <textarea id="fieldDesc" placeholder="이 챗봇이 무엇을 도와주는지 간단히 설명해 주세요."></textarea>
      </div>
      <div class="form-row">
        <label>챗봇 링크 (ChatGPT GPTs 주소 등)</label>
        <input type="url" id="fieldLink" placeholder="https://chatgpt.com/g/..." />
      </div>
      <div class="form-row">
        <button class="primary-btn" id="saveEntryBtn">저장</button>
        <button id="cancelEntryBtn" style="margin-left:8px;">취소</button>
      </div>
    </div>

    <div id="listWrap"></div>
  </div>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="admin.js"></script>
</body>
</html>
